name: The Beard Club
description: >-
  The Beard Club is a men's grooming and beard-care brand selling beard oils, balms,
  washes, aftershave, grooming kits, trimmers, and subscription grooming boxes through
  its Shopify-powered online store at thebeardclub.com. Beyond the consumer storefront,
  the store is agent-commerce ready: it implements the Universal Commerce Protocol
  (UCP 2026-04-08) with a native Model Context Protocol (MCP) endpoint at /api/ucp/mcp,
  a machine-readable /llms.txt and /agents.md, UCP service discovery at /.well-known/ucp,
  Shopify Customer Account OpenID Connect authentication, and read-only product and
  collection JSON endpoints — so AI shopping assistants can search the catalog, build
  carts, and complete buyer-approved checkouts programmatically.
